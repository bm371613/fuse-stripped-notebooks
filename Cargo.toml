[package]
name = "fuse-stripped-notebooks"
version = "0.1.1"
edition = "2024"

description = "FUSE filesystem that mounts Jupyter notebooks as stripped, read-only Python files "
homepage = "https://github.com/bm371613/fuse-stripped-notebooks"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bm371613/fuse-stripped-notebooks"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.10"
fuser = "0.17.0"
libc = "0.2.186"
log = "0.4.29"
serde_json = "1.0.149"

[dev-dependencies]
tempfile = "3"
